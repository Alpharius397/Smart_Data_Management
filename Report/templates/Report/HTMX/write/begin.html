{% if ok is True %}
    <script>
        swal({
            text:`{{ text|escapejs }}`,
            title: `{{ title|escapejs }}`,
            icon: `{{ icon|escapejs }}`,
            buttons: true
        }).then((ok) => {
            if(ok){
                window.location.href = "{{path}}{{url}}"
            }
        });
    </script>
{% else %}
    {% include "HTMX/swal.html" %}
{% endif %}
