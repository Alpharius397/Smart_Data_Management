{% load template %}
{% load static %}

{% if error %}
    <script>alert("{{error}}");</script>
{% endif %}

{% if not locked %}

    <div hx-get="{% url 'View:edit_image' id=id idx=idx %}" hx-vals='{"column":"{{column}}"}' hx-swap="outerHTML" hx-trigger="click from:find button">
        
        <button class="edit-button">
            <img src="{% static 'images/edit.svg' %}">
            <span class="popup">Edit this</span>
        </button>

    </div>

{% endif %}

{% if update is True %}

    {% with image=value|img %}

        <img src="{{image.img}}" width="{{image.width}}" height="{{image.height}}" hx-swap-oob="true" id="img_{{idx}}">

    {% endwith %}
    
{% endif %}
