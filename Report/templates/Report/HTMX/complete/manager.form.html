{% load template %}

<div class="semester-feedback">
    <h2> Feedback Form </h2>
    <form hx-post="{% url 'Report:htmxFeed' id=id idx=idx %}" hx-target="this" hx-swap="afterend" hx-trigger="click from:find button">
        {% csrf_token %}
        {% for field in form %}
            <div class="form-field">
                <label for='{{ field.id_for_label  }}'>{{ field.label }}: </label>
                {{ field }}
            </div>
            <p class="help-text">{{ field.help_text }}</p>
            
        {% endfor %}

        <button class="click-issue">Update Feedback</button>
    </form>
</div>

{% include "HTMX/swal.html" %}
