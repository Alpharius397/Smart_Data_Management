{% load template %}

{% if messages %}
    <ul class="messages" id="messages" hx-swap-oob="true">
        {% if messages %}
        {% for message in messages %}
            <li {% if message.tags %} class="{{ message.tags }}" {% endif %} >{{ message }}</li>
        {% endfor %}
        {% endif %}
    </ul>

{% else %}

    <div class="table-view-again">
        {% for %}
    </div>

{% endif %}
