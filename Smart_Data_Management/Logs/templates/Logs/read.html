{% load template %}
{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'styles/base.css' %}">
    <link rel="stylesheet" href="{% static 'styles/read.css' %}">
    <title>User Task Dashboard</title>
    <style>
        .dont-ask-why-this{
            height: 20px;
            position: sticky;
            top:0;
            background-color: white;
            z-index: 10;
            margin-bottom: -5px;
        }

        .dont-ask-why-this-either{
            display: block;
            width: 20px;
            position: sticky;
            right:0;
            background-color: white;
            z-index: 10;
        }

        thead th{
            position:sticky;
            top:20px;
            text-wrap:nowrap;
            max-width: 150px;
            overflow-x: auto;
        }

        .form-group{
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        label{
            margin-right: 5px;
        }

        table{
            width: 100vw;
            display: block;
            align-items: center;
        }
    
    </style>
</head>

<body>
    <header>
        <a href="{% url 'Logs:logs' %}"><button class="user-log">Back To Log Board</button></a>
        <h1>Log View</h1>
    </header>

    <div class="container">

        <h2>Search Log:</h2>

        <form hx-get="{% url 'Logs:search' date=date %}" hx-target=".tableView" hx-swap="innerHTML" hx-trigger="input from:find #id_search,load" hx-vals="js:{query: get_select('id_query')}" hx-on::after-request="dontAskWhy();">
            {% for field in form %}

                <div class="form-group">
                <label for='{{ field.name }}'>{{ field.label }}: </label>
                {{ field }}
                
            </div>
        {% endfor %}
        </form>

        <div class="tableView">
        </div>

    </div>

</body>
<script src="{% static 'js/htmx.js' %}"></script>
<script src="{% static 'js/script.js' %}"></script>


</html>
