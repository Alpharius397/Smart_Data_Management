{% load template %}
{% load static %}


<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'styles/base.css' %}">
    <title>User Task Dashboard</title>
    <style>

        .task-list {
            margin: 20px 0;
        }

        .task-item h3 {
            margin: 0;
            font-size: 18px;
            color: #333;
        }

        form{
            display: inline-block;
            margin-top: 10px;
        }

        a{
            text-decoration: none;
        }

        .arrow {
            position: relative;
            margin-left: auto;
            right: 5px;
            font-size: 18px;
            color: #6c757d;
        }
        .task-list:hover .arrow {
            transform: translateX(5px);
            color: #333;
        }

        .log-item:hover .arrow {
            transform: translateX(5px);
            color: #333;
        }

        .form-group{
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        label{
            margin-right: 5px;
        }

        {% if request.session.mainColor and request.session.secColor %}
            header{
                background-color: {{request.session.mainColor}};
                color: {{request.session.secColor}};
            }

            body{
                color: {{request.session.mainColor}};
            }

            header .user-log, header .add-task{
                color: {{request.session.mainColor}};
            }

        {% endif %}
    
    </style>
</head>

<body>
    <header>
        <a href="{% url 'Dash:dash' %}"><button class="user-log">Back to Dashboard</button></a>
        <h1>Log Dashboard</h1>
    </header>

    <div class="container">
        <h2>Search Log</h2>
        
        <form hx-post="{% url 'Logs:logs' %}" hx-target="#task-list" hx-swap="innerHTML" hx-trigger="input from:find #id_date,load,input from:#id_query" hx-vals="js:{query: get_select('id_query')}">
            {% csrf_token %}
            {% for field in form %}
            <div class="form-group">
                <label for='{{ field.name }}'>{{ field.label }}: </label>
                {{ field }}
                
            </div>
        {% endfor %}
        </form>

        <div class="task-list" id="task-list">

        </div>
    </div>
</body>
<script src="{% static 'js/htmx.js' %}"></script>
<script src="{% static 'js/script.js' %}"></script>
</html>
