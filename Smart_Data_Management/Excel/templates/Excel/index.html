<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }

        .upload-container {
            background: #fff;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 300px;
        }

        .upload-container h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
            margin-right: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        .form-group input:focus {
            border-color: #007bff;
            outline: none;
        }

        .upload-button {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        .upload-button:hover {
            background-color: #218838;
        }

        .form-footer {
            text-align: center;
            margin-top: 15px;
        }

        .form-footer a {
            color: #007bff;
            text-decoration: none;
        }

        .form-footer a:hover {
            text-decoration: underline;
        }

        ul.errorlist, ul.errorlist li {
            list-style-type: none;
            color: red;
            font-style: italic;
            margin: 0;
            padding: 0;
            margin-top: 5px;
        }

        p.help_text {
            font-style: italic;
            color: #555;
            margin: 0;
            padding-top: 5px;
        }

    </style>
</head>
<body>
    <div class="upload-container">
        <h2>Register</h2>
        <form action="{% url 'Excel:upload' %}" method="POST">
            {% csrf_token %}

            {% for field in form %}
                <div class="form-group">
                    <label for='{{ field.name }}'>{{ field.label }}: </label>
                    {{ field }}

                    {% if field.errors %}
                        {{ field.errors }}
                    {% else %}
                        <p class="help_text">{{ field.help_text }} </p>
                    
                    {% endif %}
                    
                </div>
            {% endfor %}
            <button type="submit" class="upload-button">Register</button>
        </form>
        <div class="form-footer">
            <p>Already have an account? <a href="{% url 'Login:login' %}">Login</a></p>
        </div>
    </div>

    <script>

        {% if alert %}
            alert("{{ alert }}");
        {% elif request.GET.alert %}
            alert("{{ request.GET.alert }}");
        {% endif %}
    </script>
</body>
</html>
