{% extends 'Dash/dash.html' %}

{% load template %}

{% block uploader_button %}
    <a href="{% url 'Upload:view' %}"><button class="add-task">Add New Task</button></a>
{% endblock %}

{% block uploader %}
    <div class="tab">
        <h2>To Assign Tasks</h2>

        <div class="sub-tab">
            <h3>Search Records: </h3>
            <form hx-get="{% url 'Dash:admin_upload' %}" hx-target="next .task-list" hx-swap="innerHTML" hx-trigger="input from:find #search,input from:#column1" hx-vals="js:{query: get_select('column1')}">
                
                <div class="form-field">
                    <label for="search">Search Keyword: </label>
                    <input type="search" placeholder="Search Here" name="value" id="search">    
                </div>

                <div class="form-field">
                    <label for="query">in Field: </label>
                    <select name="query" id="column1">
                        <option value="" disabled selected>Choose a Field here</option>
                        <option value="uploader">Uploader</option>
                        <option value="file_name">File Name</option>
                        <option value="mongo_id">Mongo ID</option>
                    </select>
                </div>

            </form>
            <div class="task-list" hx-get="{% url 'Dash:admin_upload' %}" hx-target="closest div" hx-swap="innerHTML" hx-trigger="load" hx-vals="js:{query: get_select('column1'), start: '0', value: '{{request.GET.value}}'}">

            </div>
        </div>
    </div>
{% endblock %}

{% block manager %}
    <div class="tab">
        <h2>Assigned Tasks</h2>
        <div class="sub-tab">
            <h3>Search Records: </h3>
            <form hx-get="{% url 'Dash:admin_manage' %}" hx-target="next .task-list" hx-swap="innerHTML" hx-trigger="input from:find #search,input from:#column1" hx-vals="js:{query: get_select('column1')}">
                
                <div class="form-field">
                    <label for="search">Search Keyword: </label>
                    <input type="search" placeholder="Search Here" name="value" id="search">    
                </div>

                <div class="form-field">
                    <label for="query">in Field: </label>
                    <select name="query" id="column1">
                        <option value="" disabled selected>Choose a Field here</option>
                        <option value="uploader">Uploader</option>
                        <option value="file_name">File Name</option>
                        <option value="mongo_id">Mongo ID</option>
                    </select>
                </div>

            </form>
            <div class="task-list" id="down" hx-get="{% url 'Dash:admin_manage' %}" hx-target="closest div" hx-swap="innerHTML" hx-trigger="load" hx-vals="js:{query: get_select('column1'), start: '0', value: '{{request.GET.value}}'}">
            </div>
        </div>
    </div>
{% endblock %}
