{% load template %}
{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'styles/base.css' %}">
    <link rel="stylesheet" href="{% static 'styles/read.css' %}">
    <title>User Task Dashboard</title>

    <style>
        img{
            display: block;
            margin: auto;
        }

        .spinner{
            width: 200px;
        }

        h2{
            width: max-content;
            margin: 10px auto;
        }

        .retry{
            display: grid;
            grid-template-columns: repeat(3, 1fr);
        }

        .retry button{
            grid-column: 2/3;
        }

        .retry-read{
            display: flex;
            justify-content: center;
            align-items: center;
            margin: auto;
            margin-top: auto;
        }

        .cancel-read{
            display: block;
            margin: auto;
            background-color: red;
        }


        {% if request.session.mainColor and request.session.secColor %}
        header{
            background-color: {{request.session.mainColor}};
            color: {{request.session.secColor}};
        }
        
        body{
            color: {{request.session.mainColor}};
        }

        .semester{
            background-color: {{request.session.mainColor|rgb:0.7 }};
        }

        .header-box{
            background-color: {{request.session.mainColor}};
            color: {{request.session.secColor}};
        }

        .semester h3 {
            border-color: {{request.session.secColor}};
            color: {{request.session.secColor}};
        }

        .semester p {
            color: {{request.session.secColor}};
        }

        header .user-log{
            color: {{request.session.mainColor}};
        }

        .personal-info p{
            color: {{request.session.mainColor}};
        }
    {% endif %}
    </style>

</head>

<body>
    <header>
        <a href="{% url 'Dash:dash' %}"><button class="user-log">Back To DashBoard</button></a>
        <h1>Card View</h1>
    </header>

    <div class="tableView" hx-get="{% url 'Dash:card_read' %}" hx-trigger="click from:find .begin-read" hx-swap="outerHTML">

        <div class="retry-read" >
            <button class="begin-read">Begin Read</button>
        </div>

    </div>

</body>
<script src="{% static 'js/htmx.js' %}"></script>
<script src="{% static 'js/socket.js' %}"></script>
<script>

    function runCardExe(){
        console.log("Firing exe"); 
        let answer = confirm("Begin card operation");
    
        if(answer==true) window.location.href="{{path}}{{url}}";
        else{
            htmx.trigger(".cancel-read","click")
        }
    }

</script>

</html>
