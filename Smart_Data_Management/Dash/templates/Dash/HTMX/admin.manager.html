{% load template %}


{% if error %}
    <ul class="messages">
        <li class="error">{{error}}</li>
    </ul>

{% else %}

    {% for i in manage %}
        <div class="task-item">
            <h3>Upload {{ forloop.counter }}: {{i.uploader}} - {{i.file_name}}</h3>
            <button class="drop-down down" id="up_{{forloop.counter}}">&#11206;</button>
        </div>
        <div class="task-info" id="up_{{forloop.counter}}">
            {% for j in i.manager %}
                <li>
                    {{ j  }}
                </li>
            {% endfor %}
            <a href="{% url 'View:table' id=i.id %}" class="view-button">View Data</a>
        </div>

    {% empty %}
        <h3 class="title-tag">No Sheets Assigned</h3>
    {% endfor %}

{% endif %}
