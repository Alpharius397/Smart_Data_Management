{% load template %}
{% load static %}


<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'styles/base.css' %}">
    <title>User Task Dashboard</title>
    <style>
        a{
            text-decoration: none;
        }
        
        .arrow {
            margin-left: auto;
            font-size: 18px;
            color: #6c757d;
            display: inline;
        }
        
        .log-view{
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        {% if request.session.mainColor and request.session.secColor %}
            header{
                background-color: {{request.session.mainColor}};
                color: {{request.session.secColor}};
            }

            body{
                color: {{request.session.mainColor}};
            }

            header .user-log, header .add-task{
                color: {{request.session.mainColor}};
            }

            .task-item h3{
                color: {{request.session.mainColor}};
            }

            .container{
                background-color: {{request.session.secColor}};
            }

        {% endif %}


    </style>
</head>

<body>
    <header>
        <a href="{% url 'Logout:logout' %}"><button class="user-log">Logout</button></a>
        <h1>Task Dashboard</h1>
        {% block manager_button%}{% endblock %}
        {% block uploader_button%}{% endblock %}
    </header>

        {% block uploader %} {% endblock %}
        {% block manager %} {% endblock %}

        <div class="container">
            <div class="log-view">
            <h2><span>View Logs</span></h2>
            <a href="{% url 'Logs:logs' %}" class="log-item">
                <span class="arrow">&#9654;</span>
            </a>
            </div>
        </div>

        <div class="container">
            <div class="log-view">
            <h2><span>Account Settings</span></h2>
            <a href="{% url 'User:index' %}" class="log-item">
                <span class="arrow">&#9654;</span>
            </a>
            </div>
        </div>
</body>
<script src="{% static 'js/htmx.js' %}"></script>

<script src="{% static 'js/script.js' %}"></script>
<script>

    function attach_event(){
        const elements = document.querySelectorAll(".drop-down");

        elements.forEach((element) => {
            const id = element.id;

            element.addEventListener('click', ()=>{
                
                if (element.classList.contains('up')) {
                    element.classList.replace('up','down');
                    document.querySelector(`.task-info#${id}`).style.display = 'none';
                } else {
                    element.classList.replace('down','up');
                    document.querySelector(`.task-info#${id}`).style.display = 'block';
                }
            })
        })
    }


    htmx.on(".task-list","htmx:afterSettle", function(event){
        attach_event();
    })

</script>

</html>
