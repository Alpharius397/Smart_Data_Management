{% load template %}
{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Task Dashboard</title>
    <link rel="stylesheet" href="{% static 'styles/base.css' %}">
    <style>
        
        img{
            width: 200px;
            display: block;
            margin: 10px auto;
        }

        .dont-ask-why-this{
            height: 20px;
            position: relative;
            background-color: white;
            z-index: 10;
            margin-bottom: -5px;
        }

        thead th{
            position:sticky;
            top:0px;
            text-wrap:nowrap;
            max-width: 300px;
            overflow-x: scroll;
        }

        #verify{
            color:#4CAF50;
            display:inline;
        }

        #unchecked{
            color:#555;
            display:inline;
        }

        #reject{
            color: red;
            display:inline;
        }

        #feed-text{
            font-style: italic;
            display:inline;
        }

        #correct{
            display: inline-block;
            padding: 10px;
            color: white;
            background-color: green;
        }

        #wrong{
            display: inline-block;
            padding: 10px;
            color: white;
            background-color: red;
        }

        #none{
            display: inline-block;

            padding: 10px;
            color: white;
            background-color: grey;
        }

        th.next-button, td.next-button{
            position: sticky;
            right: 0px;
            z-index: 10;
            overflow-x:auto;
            padding: 0;
        }

        th.next-button{
            z-index: 20;
        }

        .view-icon button, a{
            background-color: #4CAF50;
            border-radius: 50px;
        }

        .grid-layout{
            display: grid;
            grid-template-rows: 1fr 2fr;
            align-items: center;
            justify-content: center;
            grid-template-columns: 1fr;
            z-index: 0;
            border: #555;
            column-gap: 5px;
        }

        .data-loading{
            display: flex;
            justify-content: center;
            align-content: center;
            align-items: center;
            flex-direction: row;
            max-height: max-content;
        }

        table th{
            width: 500px;
        }

        .tab-sub{
            display: inline-flex;
        }

        form{
            margin-bottom: 10px;
            display: block;
        }
        
        h4, form{
            margin-left: 10px;
        }

        select{
            max-width: 200px;
        }

        .edit{
            width: 20px;
            height: 20px;
            background-color: white;
            display: inline-flex;
            padding: 0px;
            margin: auto;
            transition: 500ms;
        }

        td.next-button button{
            width: 100px;
            height: 50px;
        }

        img.edit:hover{
            border-bottom: 3px grey solid;
            transition: 500ms;
        }
        
        .loading{
            position: sticky;
            left:35vw;
        }

        .refresh{
            display: flex;
            background-color:#0098ff;
            justify-items: center;
            align-items: center;
            overflow: hidden;
        }

        .refresh-text, .view-text{
            margin: 1px;
            display: flex;
            transition: 1s;
            align-content: center;
            justify-items: center;
            text-align: center;
            margin: auto;
        }

        .refresh:hover{
            background-color: #0098ff;
        }

        .view-icon{
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .view-icon:hover img{
            margin: 0;
            opacity: 1;
            height: 30px;
            transform: rotateZ(180deg) translateX(-50%);
            transition: 1s;
        }

        .view-icon:hover p{
            margin: 0;
            opacity: 0;
            transform: rotateZ(180deg) translateX(50%);
            transition: 1s;
        }

        .view-icon{
            display: flex;
            justify-content: center;
            align-content: center;
        }

        .view-icon p, .view-icon img{   
            width: 30px;
            height: 30px;
            margin: 0;
            display: block;
            position: relative;
        }

        .view-icon img{
            transform: translateX(50%);
            position: relative;
            opacity: 0;
            transition: 1s;
        }

        .view-icon img{
            height: 0;
        }

        .view-icon p{
            position: relative;
            opacity: 1;
            transform: translateX(-50%);
        }

        .refresh img{
            display: inline;
            width: 30px;
            height: 30px;
            padding: 0;
            transition: 1s;
        }

        p.refresh-text{
            width: 50px;
            margin: 0;
        }
        
        .refresh:hover p{
            width: 0px;
            transform: translateX(50px);
            transition: 1s;
        }

        .report-status p:hover{
            transition: 1s;
        }

        .refresh:hover img{
            margin: auto;
            transform: rotateZ(180deg);
            transition: 1.5s;
        }
    
        table tr td {
            background-color: white;
            transition: background-color 500ms;
        }

        table tr.htmx-added td{
            background-color: yellow;
        }

        div.report-status{
            font-weight: bold;
            flex-shrink: 1;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        div.report-status p{
            display: inline;
            width: max-content;
            margin: 4px;
            border-radius: 50px;
        }

        .report-text{
            display: inline;
        }

        .status-report{
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            margin: 2px;
        }

        tr.htmx-request td{
            opacity: 0;
        }

        tr.htmx-request button.edit{
            display: none;
        }

        tr.htmx-request td{
            opacity: 0.5;
        }
        tr.htmx-request td.next-button{
            opacity: 1;
        }


        @keyframes rotateAboutZ {
            0%   {transform: rotateZ(0deg);}
            25%   {transform: rotateZ(90deg);}
            50%   {transform: rotateZ(180deg);}    
            75%   {transform: rotateZ(270deg);}
            100%   {transform: rotateZ(360deg);}
        }

        tr.htmx-request .refresh img{
            animation-name: rotateAboutZ;
            animation-iteration-count: infinite;
            animation-duration: 2s;
        }

        
        {% if request.session.mainColor and request.session.secColor %}
            header{
                background-color: {{request.session.mainColor}};
                color: {{request.session.secColor}};
            }
            
            body{
                color: {{request.session.mainColor}};
            }

            header .user-log, header .add-task{
                color: {{request.session.mainColor}};
            }


        {% endif %}

    </style>
</head>

<body>
    <header>
        <a href="{% url 'Dash:dash' %}"><button class="user-log">Back To DashBoard</button></a>
        <h1>Table View</h1>

        {% block upload_button %}{% endblock %}
    </header>

    <div class="container" hx-get="{% url 'View:table' id=id %}" hx-target="this" hx-swap="outerHTML" hx-trigger="load">

        <div class="searchQuery">
            <h2>Search Columns: </h2>
            <form onsubmit="event.preventDefault()">
                
                <label for="column">Column: </label>
                <select name="column" id="column">
                    <option value>-----------</option>
                </select>

                <label for="search">Containing: </label>

                <input type="search" list="suggests" autocomplete="off" name="search" id="search" placeholder="Enter search keyword">
                <h3> Additional Search: </h3>
            
                <label for="status">Status: </label>
                <select name="status" id="status" class="searchSelect">
                    <option value="">----------</option>
                    <option value="none">Unchecked</option>
                    <option value="true">Verified</option>
                    <option value="false">Rejected</option>
                </select>
    
                <label for="lock">Locked: </label>
                <select name="lock" id="lock" class="searchSelect">
                    <option value="">----------</option>
                    <option value="true">Locked</option>
                    <option value="false">Not Locked</option>
                </select>
    
                <label for="issue">Issued: </label>
                <select name="issue" id="issue" class="searchSelect">
                    <option value="">----------</option>
                    <option value="true">Issued</option>
                    <option value="false">Not Issued</option>
                </select>
            </form>

        </div>


        <div class="tableView">
            <img src="{% static 'img/spinner.gif' %}" alt="Loading">
        </div>
    </div>
</div>

</body>
<script src="{% static 'js/htmx.js' %}"></script>
<script src="{% static 'js/script.js' %}"></script>
<script src="{% static 'js/socket.js' %}"></script>
</html>
