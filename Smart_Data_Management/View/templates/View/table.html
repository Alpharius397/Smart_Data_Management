{% load template %}
{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Task Dashboard</title>
    <link rel="stylesheet" href="{% static 'styles/base.css' %}">
    <style>
        
        img{
            width: 200px;
            display: block;
            margin: 10px auto;
        }

        .dont-ask-why-this{
            height: 20px;
            position: relative;
            background-color: white;
            z-index: 10;
            margin-bottom: -5px;
        }

        .dont-ask-why-this-either{
            display: block;
            width: 20px;
            position: sticky;
            right:0;
            background-color: white;
            z-index: 10;
        }

        thead th{
            position:sticky;
            top:0px;
            text-wrap:nowrap;
            max-width: 300px;
            overflow-x: scroll;
        }

        #verify{
            color:#4CAF50;
            display:inline;
        }

        #unchecked{
            color:#555;
            display:inline;
        }

        #reject{
            color: red;
            display:inline;
        }

        #feed-text{
            font-style: italic;
            display:inline;
        }

        .verify-sing{
            position:sticky;
            right: 96px;
            z-index: 10;
            overflow-x:auto;
        }

        .verify-sing p{
            border-radius: 5px;
        }

        #correct{
            display: inline-block;
            padding: 10px;
            color: white;
            background-color: green;
        }

        #wrong{
            display: inline-block;
            padding: 10px;
            color: white;
            background-color: red;
        }

        #none{
            display: inline-block;

            padding: 10px;
            color: white;
            background-color: grey;
        }

        .next-button{
            position: sticky;
            right: 0px;
            z-index: 10;
            overflow-x:auto;
        }

        td.next-button{
            z-index: 0;
        }

        table th{
            width: 500px;
        }

        td.verify-sing{
            z-index: 0;
        }

        .tab-sub{
            display: inline-flex;
        }

        form{
            margin-bottom: 10px;
            display: block;
        }
        
        h4, form{
            margin-left: 10px;
        }

        select{
            max-width: 200px;
        }

        .edit{
            width: 20px;
            height: 20px;
            background-color: white;
            display: inline-flex;
            padding: 0px;
            margin: auto;
        }

        img.edit:hover{
            border-bottom: 3px grey solid;
        }
        
        .loading{
            position: sticky;
            left:35vw;
        }

        .refresh{
            display: inline-flex;
            background-color:#0098ff;
            justify-items: center;
            align-items: center;
        }

        .refresh:hover{
            background-color: #0098ff;
            opacity: 0.5;
        }

        .refresh img{
            width: 30px;
            height: 30px;
            margin: 0;
            padding: 0;
            transition: 1s;
        }
        
        {% if request.session.mainColor and request.session.secColor %}
            header{
                background-color: {{request.session.mainColor}};
                color: {{request.session.secColor}};
            }
            
            body{
                color: {{request.session.mainColor}};
            }

            header .user-log, header .add-task{
                color: {{request.session.mainColor}};
            }


        {% endif %}

    </style>
</head>

<body>
    <header>
        <a href="{% url 'Dash:dash' %}"><button class="user-log">Back To DashBoard</button></a>
        <h1>Table View</h1>

        {% block upload_button %}{% endblock %}
    </header>

    <div class="container" hx-get="{% url 'View:table' id=id %}" hx-target="this" hx-swap="outerHTML" hx-trigger="load">

        <div class="searchQuery">
            <h2>Search Columns: </h2>
            <form onsubmit="event.preventDefault()">
                
                <label for="column">Column: </label>
                <select name="column" id="column">
                    <option value>-----------</option>
                </select>

                <label for="search">Containing: </label>

                <input type="search" list="suggests" autocomplete="off" name="search" id="search" placeholder="Enter search keyword">
                <h3> Additional Search: </h3>
            
                <label for="status">Status: </label>
                <select name="status" id="status" class="searchSelect">
                    <option value="">----------</option>
                    <option value="none">Unchecked</option>
                    <option value="true">Verified</option>
                    <option value="false">Rejected</option>
                </select>
    
                <label for="lock">Locked: </label>
                <select name="lock" id="lock" class="searchSelect">
                    <option value="">----------</option>
                    <option value="true">Locked</option>
                    <option value="false">Not Locked</option>
                </select>
    
                <label for="issue">Issued: </label>
                <select name="issue" id="issue" class="searchSelect">
                    <option value="">----------</option>
                    <option value="true">Issued</option>
                    <option value="false">Not Issued</option>
                </select>
            </form>

        </div>


        <div class="tableView">
            <img src="{% static 'img/spinner.gif' %}" alt="Loading">
        </div>
    </div>
</div>

</body>
<script src="{% static 'js/htmx.js' %}"></script>
<script src="{% static 'js/script.js' %}"></script>
</html>
