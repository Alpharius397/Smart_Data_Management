{% load template %}
{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Task Dashboard</title>
    <link rel="stylesheet" href="{% static 'styles/base.css' %}">
    <style>
        
        img{
            width: 200px;
            display: block;
            margin: 10px auto;
        }

        .dont-ask-why-this{
            height: 20px;
            position: sticky;
            top:0;
            background-color: white;
            z-index: 10;
            margin-bottom: -5px;
        }

        .dont-ask-why-this-either{
            display: block;
            width: 20px;
            position: sticky;
            right:0;
            background-color: white;
            z-index: 10;
        }

        thead th{
            position:sticky;
            top:20px;
        }

        p.help_text {
            font-style: italic;
            color: #555;
            margin: 0;
            padding-top: 5px;
        }

        #verify{
            color:#4CAF50;
            display:inline;
        }

        #unchecked{
            color:#555;
            display:inline;
        }

        #reject{
            color: red;
            display:inline;
        }

        #feed-text{
            font-style: italic;
            display:inline;
        }

        .verify-sing{
            position:sticky;
            right: 73px;
            z-index: 10;
        }

        #correct{
            padding: 10px;
            color: white;
            background-color: green;
        }

        #wrong{
            padding: 10px;
            color: white;
            background-color: red;
        }

        #none{
            padding: 10px;
            color: white;
            background-color: grey;
        }

        .next-button{
            position: sticky;
            right: 0px;
            z-index: 10;
        }

        td.next-button{
            z-index: 0;
        }

        table th{
            width: 500px;
        }

        td.verify-sing{
            z-index: 0;
        }

        .tab-sub{
            display: inline-flex;
        }

        form{
            margin-bottom: 10px;
            display: block;
        }
        
        h4, form{
            margin-left: 10px;
        }

        select{
            max-width: 200px;
        }

    </style>
</head>

<body>
    <header>
        <a href="{% url 'Dash:dash' %}"><button class="user-log">Back To DashBoard</button></a>
        <h1>Table View</h1>

        {% block upload_button %}{% endblock %}
    </header>

    <div class="container" hx-get="{{request.path}}" hx-target="this" hx-swap="outerHTML" hx-trigger="load">

        <div class="searchQuery">
            <h2>Search Columns: </h2>
            <form onsubmit="event.preventDefault()">
                
                <label for="column">Column: </label>
                <select name="column" id="column">
                    <option value>-----------</option>
                </select>

                <label for="search">Containing: </label>

                <input type="search" list="suggests" autocomplete="off" name="search" id="search" placeholder="Enter search keyword">

                <button type="submit"> Search </button>
                <button type="cancel"> Cancel Search </button>

            </form>

        </div>


        <div class="tableView">
                <img src="{% static 'img/spinner.gif' %}" alt="Loading">
            </div>
        </div>

    </div>

</body>
<script src="{% static 'js/script.js' %}"></script>
<script>

    add_csrf();

</script>
<script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>

</html>
