{% load template %}
{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'styles/base.css' %}">
    <link rel="stylesheet" href="{% static 'styles/read.css' %}">
    <title>User Task Dashboard</title>
    <style>


        form{
            display: inline-block;
            margin-top: 0px;
        }

        .loading-button{
            background-color: grey;
        }

        .error-button{
            background-color: red;
        }
        
        .write-card{
            display: inline-block;
        }
        
        {% if request.session.mainColor and request.session.secColor %}
            header{
                background-color: {{request.session.mainColor}};
                color: {{request.session.secColor}};
            }
            
            body{
                color: {{request.session.mainColor}};
            }

            .semester{
                background-color: {{request.session.mainColor|rgb:0.7 }};
            }

            .header-box{
                background-color: {{request.session.mainColor}};
                color: {{request.session.secColor}};
            }

            .semester h3 {
                border-color: {{request.session.secColor}};
                color: {{request.session.secColor}};
            }

            .semester p {
                color: {{request.session.secColor}};
            }

            header .user-log{
                color: {{request.session.mainColor}};
            }

            .personal-info p{
                color: {{request.session.mainColor}};
            }
        {% endif %}

    </style>
</head>

<body>
    <header>
        <a href="{% url 'View:table' id=id %}"><button class="user-log">Back To Table View</button></a>
        <h1>Row View</h1>
    </header>

    <div class="container" hx-get="{% url 'View:index' id=id idx=idx %}" hx-vals='{"id":"{{id}}","idx":"{{idx}}"}' hx-trigger="load" hx-target=".tableView">

        <div class="tableView" hx-get="{% url 'View:feed' id=id idx=idx %}" hx-swap="outerHTML" hx-target=".feedback" hx-trigger="load">
        
        </div>


        <div class="feedback"></div>

        {% if manage %}
            <div class="issue_card"></div>
            <ul class="messages" id="messages"></ul>
        {% endif %}

        {% csrf_token %}
    </div>

</body>
<script src="{% static 'js/htmx.js' %}"></script>
<script src="{% static 'js/script.js' %}"></script>
<script>
    add_csrf();
</script>
</html>
