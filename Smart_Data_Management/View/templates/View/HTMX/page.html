{% load template %}
{% load static %}

<div class="container">

    <div class="searchQuery">
        <h2>Search Columns: </h2>
        <form hx-get="{% url 'View:search' id=id %}" hx-target="#tableView" hx-swap="innerHTML" hx-trigger="input from:#search,load" hx-on::after-request="dontAskWhy();">
            
            <label for="column">Column: </label>
            <select name="column" id="column">
                <option value="">----------</option>
                {% for i in available %}
                    <option value="{{ i }}"> {{ i }}</option>
                {% endfor %}
            </select>

            <label for="search">Containing: </label>

            <input type="search" list="suggests" autocomplete="off" name="search" id="search" placeholder="Enter search keyword" value="{{request.GET.search}}" hx-swap="innerHTML" hx-target="#suggests" hx-get="{% url 'View:suggest' id=id %}" hx-vals="js:{column: get_select()}" hx-trigger="cancel,load, keyup,click from:#column " hx-on::after-request="dontAskWhy();">

            <datalist id="suggests" autocomplete="false">

            </datalist>

        </form>

    </div>

    <div class="tableView" id="tableView">
    
        
    </div>

    {% if admin %}
        <div id="hidden" hidden hx-get="{% url 'View:assign' id=id %}" hx-swap="outerHTML" hx-trigger="htmx:afterSwap from:next #messages" hx-target="next .assign" hx-swap="outerHTML"></div>
        <div class="assign" id="outerDIV" hx-get="{% url 'View:assign' id=id %}" hx-trigger="load" hx-swap="outerHTML"></div>
        <ul class="messages" id="messages"></ul>
    {% endif %}
</div>
