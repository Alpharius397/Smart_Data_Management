{% load template %}
{% load static %}

<style>
    .rows {
        display: grid;
        grid-template-columns: repeat({{column|len|add:1}}, 250px);
    }

</style>
<div class="tab">

    <div class="searchQuery">
        <h2>Search Columns: </h2>
        <form hx-get="{% url 'View:search_row' id=id %}" hx-target=".change-me" hx-swap="innerHTML" hx-trigger="input from:.searchSelect,input from:#search" hx-on::after-request="dontAskWhy();" onsubmit="event.preventDefault();">
            
            <div class="form-field">
                <label for="search">Search For: </label>
                <input type="search" list="suggests" autocomplete="off" name="search" id="search" placeholder="Enter search keyword" value="{{request.GET.search}}" hx-swap="innerHTML" hx-target="#suggests" hx-get="{% url 'View:suggest' id=id %}" hx-vals="js:{column: get_select(), issue: get_select('issue'), status: get_select('status'), lock: get_select('lock')}" hx-trigger="cancel, keyup,click from:.searchSelect " hx-on::after-request="dontAskWhy();">
                <datalist id="suggests" autocomplete="false">
                </datalist>
            </div>

            <div class="form-field">
                <label for="column">in Column: </label>
                <select name="column" id="column" class>
                    <option value="">----------</option>
                    {% for i,j in available.items %}
                        <option value="{{ i }}"> {{ j }}</option>
                    {% endfor %}
                </select>
            </div>

            <h3> Additional Search: </h3>
                
            <div class="form-field">

                <label for="status">Status: </label>
                <select name="status" id="status" class="searchSelect">
                    <option value="">----------</option>
                    <option value="none">Unchecked</option>
                    <option value="true">Verified</option>
                    <option value="false">Rejected</option>
                </select>
            </div>

            <div class="form-field">

                <label for="lock">Locked: </label>
                <select name="lock" id="lock" class="searchSelect">
                    <option value="">----------</option>
                    <option value="true">Locked</option>
                    <option value="false">Not Locked</option>
                </select>
            </div>

            <div class="form-field">

                <label for="issue">Issued: </label>
                <select name="issue" id="issue" class="searchSelect">
                    <option value="">----------</option>
                    <option value="true">Issued</option>
                    <option value="false">Not Issued</option>
                </select>

            </div>
        </form>
    </div>


    <div class="table-view">
        <div class="rows first">
            {% for i in column %}
                <p class="column-heading">{{i}}</p>
            {% endfor %}
            <p class="column-heading view-area">View Data</p>
        </div>
        <div class="change-me">
            <div class="rows first"
                hx-get="{% url 'View:search_row' id=id %}" 
                hx-vals= '{"page": "0", "column": "{{ request.GET.column }}", 
                            "issue": "{{ request.GET.issue }}", "lock": "{{ request.GET.lock }}", 
                            "search": "{{ request.GET.search }}", "status": "{{ request.GET.status }}"}' 
                hx-trigger="load" hx-target='this' hx-swap="outerHTML settle:500ms">
        </div>
    </div>
</div>

    {% if admin is True %}
        <div class="assign" id="outerDIV" hx-get="{% url 'View:assign' id=id %}" hx-trigger="load" hx-swap="outerHTML"></div>
        <ul class="messages" id="messages"></ul>
        
    {% endif %}
</div>
</div>
