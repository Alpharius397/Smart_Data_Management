{% load static %}

<form hx-post="{% url 'User:mailChange' %}" hx-target="this" hx-swap="outerHTML">
    {% csrf_token %}
    <input type="email" value="{{request.user.email}}" name="user">
    <button class="upload-button">Change Email</button>
    <button type="cancel" id="cancel" class="upload-button" hx-put="{% url 'User:mailChange' %}" hx-swap="outerHTML">Cancel</button>
</form>
