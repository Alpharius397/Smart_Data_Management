services:
  db:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/test
    env_file:
      - .env.prod

  redis:
    image: redis:8.0.3-alpine
    ports:
      - '6379:6379'
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes: 
      - redis_data:/var/lib/redis/test
    env_file:
      - .env.prod

  django-web:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - gunicorn_socket:/run/
      - static_volume:/app/static
      - media_volume:/app/media

    develop:
      watch:
        - action: sync
          path: .
          target: ./app/
        - action: rebuild
          path: require.txt

    env_file:
      - .env.prod

  nginx:
    build: ./nginx
    ports:
      - "80:80"
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
      - gunicorn_socket:/run/
    depends_on:
      - django-web

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  gunicorn_socket:
