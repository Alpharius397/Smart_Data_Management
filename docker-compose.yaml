services:
  db:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    env_file:
      - .env.prod

  redis:
    image: redis:8.0.3-alpine
    ports:
      - '6378:6379'
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes: 
      - redis_data:/var/lib/redis/test
    env_file:
      - .env.prod

  django-web:
    build: .
    ports:
      - "8001:8000"
    depends_on:
      - db
      - redis
    volumes:
      - gunicorn_socket:/run/
      - static_volume:/app/static
      - media_volume:/app/media
      - ssl_cert:/app/nginx/certificate/

    develop:
      watch:
        - action: rebuild
          path: require.txt

    env_file:
      - .env.prod

  nginx:
    build: ./nginx
    ports:
      - "81:443"

    develop:
      watch:
        - action: rebuild
          path: /nginx
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
      - gunicorn_socket:/run/
      - ssl_cert:/app/nginx/certificate/
    depends_on:
      - django-web

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  gunicorn_socket:
  ssl_cert:
