{% load static %}

<div class="messages" id="messages" hx-swap-oob="true">
  {% if messages %}
    <ul>
      {% for message in messages %}
          <li {% if message.tags %} class="{{ message.tags }}" {% endif %} >{{ message }}</li>
      {% endfor %}
    </ul>
  {% endif %}
</div>

<div hx-get="{% url 'User:mailChange' %}" 
     hx-swap="outerHTML" 
     hx-target="this" 
     hx-target="click from:find button" 
     class="username"
     >
    {% if email %}
        {{email}} 
    {% else %}
        No Email
    {% endif %}
    
    <button class="edit"><img src="{% static 'img/edit.svg' %}" class="edit"></button>
</div>
