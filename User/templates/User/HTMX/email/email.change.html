{% load static %}

<form hx-post="{% url 'User:mailChange' %}" hx-target="this" hx-swap="outerHTML" hx-trigger="click from:find button[type='submit']" onsubmit="event.preventDefault();">

    {% csrf_token %}
    <input type="email" value="{{email}}" name="email">
    <button class="upload-button" type="submit">Change Email</button>
    <button type="cancel" class="cancel-button" hx-get="{% url 'User:username' %}" hx-swap="outerHTML" hx-trigger="click">Cancel</button>
</form>
