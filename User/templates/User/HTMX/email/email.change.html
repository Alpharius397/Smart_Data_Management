{% load static %}

<form hx-post="{% url 'User:mailChange' %}" hx-target="this" hx-swap="outerHTML" hx-trigger="click from:find button[type='submit']" onsubmit="event.preventDefault();">

  {% csrf_token %}
  <div class="form-field"><input type="email" value="{{email}}" name="email"></div></div>
<div class="form-field"><button class="upload-button" type="submit">Change Email</button></div>
<div class="form-field"><button type="cancel" class="cancel-button" hx-get="{% url 'User:mail' %}" hx-swap="outerHTML" hx-trigger="click">Cancel</button></div>
</form>
