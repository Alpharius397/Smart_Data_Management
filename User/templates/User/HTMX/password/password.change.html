{% load static %}

<form hx-post="{% url 'User:passChange' %}" hx-target="this" hx-swap="outerHTML" hx-trigger="click from:find button[type='submit']" onsubmit="event.preventDefault();">
    {% csrf_token %}
    <input type="password" name="previous" placeholder="Previous Password">
    <input type="password" name="new" placeholder="New Password">
    <button class="upload-button" type="submit">Change Password</button>
    <button type="cancel" class="upload-button" hx-get="{% url 'User:password' %}" hx-target="closest form" hx-swap="outerHTML">Cancel</button>
</form>
