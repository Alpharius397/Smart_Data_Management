{% load static %}

<form hx-post="{% url 'User:passChange' %}" hx-target="this" hx-swap="outerHTML">
    {% csrf_token %}
    <input type="password" name="previous" placeholder="Previous Password">
    <input type="password" name="new" placeholder="New Password">
    <button class="upload-button">Change Password</button>
    <button type="cancel" id="cancel" class="upload-button" hx-put="{% url 'User:passChange' %}" hx-target="closest form" hx-swap="outerHTML">Cancel</button>
</form>
