{% load static %}

<form hx-post="{% url 'User:passChange' %}" hx-target="this" hx-swap="outerHTML" hx-trigger="click from:find button[type='submit']" onsubmit="event.preventDefault();">
    {% csrf_token %}
    <div class="form-field"><input type="password" name="previous" placeholder="Previous Password" data-title="Enter Previous Password"></div>
    <div class="form-field"><input type="password" name="new" placeholder="New Password" title ="Enter New Password"></div>
    <div class="form-field"><button class="upload-button" type="submit">Change Password</button></div>
    <div class="form-field"><button type="cancel" class="upload-button" hx-get="{% url 'User:password' %}" hx-target="closest form" hx-swap="outerHTML">Cancel Change</button></div>
</form>
