syntax = "proto3";

// version 3

// The header defining it's origin
message Header {
  int32 university = 1;
  int32 institute = 2;
  int32 branch = 3;
  int32 schema = 4;
}

// Detail of each individual subjects
message Meta {
  string id = 1;
  int32 total = 2;
  map<string, string> other = 3;
}

// Detail of semester
message Subject {
  map<string, Meta> subject = 1;
}

message CardData {
  Header header = 1;
  map<int32, Subject> semester = 2;
  map<string, string> personal = 3;
  map<string, bytes> image = 4;
}
