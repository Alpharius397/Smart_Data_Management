{% load template %}
{% load static %}

<div class="row-data column-{{ column }}">

    {% if locked is False %}

        <div hx-put="{% url 'Table:htmxSemEditText' id=id idx=idx rowID=rowID %}"
            hx-vals='{"column":"{{column}}"}'
            hx-target="closest div" hx-swap="outerHTML" hx-trigger="click from:find img">

            {{ value|str }}
            <img class="edit-button" src="{% static 'images/edit.svg' %}" data-title="Edit This Field" loading="lazy">

        </div>

    {% else %}
        <div>
            {{value|str}}
        </div>
    {% endif %}
</div>
